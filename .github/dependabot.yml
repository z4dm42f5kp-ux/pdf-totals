# Weekly update proposals for the Python dependencies (requirements.txt) and for the
# GitHub Actions used by the workflows. Security updates are proposed as soon as an
# advisory is published.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
