name: Translate documentation

# Regenerates the German and Spanish documentation from the English originals with
# Argos Translate (free and open-source, MIT license) whenever the English files change.

on:
  push:
    branches: [main]
    paths:
      - README.md
      - docs/en/**
      - tools/translate_docs.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Argos Translate
        run: pip install argostranslate --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Translate
        run: python tools/translate_docs.py

      - name: Commit translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.de.md README.es.md docs/de docs/es
          if git diff --cached --quiet; then
            echo "Translations unchanged."
          else
            git commit -m "Update German and Spanish documentation (Argos Translate)"
            git push
          fi
